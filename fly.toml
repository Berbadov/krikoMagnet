# Kriko Magnet on Fly.io. Deploy from this directory with the Fly CLI logged in:
#   flyctl deploy --local-only          # builds the local Docker image, pushes it
#   flyctl volumes create magnet_data --size 5 --region fra --app kriko-magnet
#   flyctl secrets set MAGNET_API_TOKEN=... MAGNET_ADMIN_TOKEN=... --app kriko-magnet
# Then upload the index and Tranco list into the volume once (see README):
#   tar -czf - -C <dir-with-data> site_index.sqlite tranco_top100k.txt \
#     | flyctl ssh console -C 'tar -xzf - -C /app/data' --app kriko-magnet
# Point the Kriko gateway at https://kriko-magnet.fly.dev with KRIKO_MAGNET_URL,
# KRIKO_MAGNET_TOKEN and KRIKO_MAGNET_ADMIN_TOKEN.

app = "kriko-magnet"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  MAGNET_HOST = "0.0.0.0"
  MAGNET_PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[http_service.concurrency]
  type = "requests"
  soft_limit = 50
  hard_limit = 100

[[mounts]]
  source = "magnet_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
