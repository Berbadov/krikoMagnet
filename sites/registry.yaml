  # --- general reference sources ---------------------------------------
  # Used only when the query hits no consumer topic (see sites/planner.py).
  # Checked live on 2026-11-20 with the honest UA. Only endpoints whose
  # robots.txt allows the honest agent are listed: MediaWiki's /w/api.php and
  # /api/rest_v1 are Disallow, api.wikimedia.org is the allowed gateway.

  - id: wikipedia
    name: Wikipedia (English)
    domain: en.wikipedia.org
    topics: [general]
    language: en
    region: global
    priority: 40
    timeout_s: 8
    methods:
      - type: json_search
        url: https://api.wikimedia.org/core/v1/wikipedia/en/search/page?q={query}&limit=10
        items_path: pages
        title: title
        snippet: excerpt
        url_field: key
        url_template: https://en.wikipedia.org/wiki/{value}
        probes: 1
        max_results: 10
    notes: "api.wikimedia.org search returns title/excerpt/key; /w/api.php and /api/rest_v1 are robots-disallowed."

  - id: wikipedia-tr
    name: Vikipedi
    domain: tr.wikipedia.org
    topics: [general]
    language: tr
    region: tr
    priority: 40
    timeout_s: 8
    methods:
      - type: json_search
        url: https://api.wikimedia.org/core/v1/wikipedia/tr/search/page?q={query}&limit=10
        items_path: pages
        title: title
        snippet: excerpt
        url_field: key
        url_template: https://tr.wikipedia.org/wiki/{value}
        probes: 1
        max_results: 10
    notes: "Turkish sister of the wikipedia entry, same allowed gateway."

  - id: crossref
    name: Crossref
    domain: api.crossref.org
    topics: [general]
    language: en
    region: global
    priority: 30
    timeout_s: 8
    methods:
      - type: json_search
        url: "https://api.crossref.org/works?query={query}&rows=10&select=title,URL,abstract,container-title"
        items_path: message.items
        title: title
        snippet: abstract
        url_field: URL
        probes: 2
        max_results: 10
    notes: "Scholarly metadata API; query= is a relevance search. Titles arrive as a one-element list."

  - id: mathstackexchange
    name: Mathematics Stack Exchange
    domain: api.stackexchange.com
    topics: [general]
    language: en
    region: global
    priority: 30
    timeout_s: 8
    methods:
      - type: json_search
        url: "https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&q={query}&site=math&pagesize=10&filter=withbody"
        items_path: items
        title: title
        snippet: excerpt
        body_field: body
        url_field: link
        date: creation_date
        probes: 1
        max_results: 10
    notes: "api.stackexchange.com is allowed and returns question bodies (filter=withbody), so the robots-disallowed question pages are never fetched."

  - id: stackoverflow
    name: Stack Overflow
    domain: api.stackexchange.com
    topics: [general]
    language: en
    region: global
    priority: 20
    timeout_s: 8
    methods:
      - type: json_search
        url: "https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&q={query}&site=stackoverflow&pagesize=10&filter=withbody"
        items_path: items
        title: title
        snippet: excerpt
        body_field: body
        url_field: link
        date: creation_date
        probes: 1
        max_results: 10
    notes: "Same API host as mathstackexchange with site=stackoverflow; bodies come from the API."

open_web:
  # Best-effort open-web fallback, used only when the registry returns nothing.
  # The Common Crawl index maps URL patterns, not page text, so it can only
  # surface pages whose URL carries a query term. It is a discovery aid, not a
  # web search engine, and it degrades to no-op when the index is unavailable.
  enabled: true
  index: https://index.commoncrawl.org/CC-MAIN-2026-43-index
  domains:
    - en.wikipedia.org
    - tr.wikipedia.org
    - arxiv.org
    - github.com
  max_domains: 3

